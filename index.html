    />
    <!-- Absolute URL: Telegram is where this link gets shared, and it is the
         strictest of the crawlers about resolving og:image. Update the host

    <!-- Fonts are self-hosted: the audience sits behind restricted networks
         where fonts.gstatic.com is not guaranteed to resolve, and a font host
         that fails takes the page's typography with it. Preloading only the
         two cuts the first screen actually renders. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/onest-300-800-cyrillic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/playfair-display-400-600-i-cyrillic.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics — automatic zone-linked setup doesn't apply
         to a *.workers.dev host, so this is the manual beacon. No cookies,
         no client-side state; token is a public site identifier, not a
         secret. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "3e256e8dc4e4410c962633c2cf76b9a1"}'
    ></script>
